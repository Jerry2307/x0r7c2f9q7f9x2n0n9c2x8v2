<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Clone Files từ Shared Drive → My Drive</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f6fa;
        padding: 30px;
      }
      .container {
        max-width: 980px;
        margin: auto;
        background: #fff;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      }
      h2 {
        margin-top: 0;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      button {
        padding: 10px 14px;
        cursor: pointer;
        border-radius: 6px;
        border: 1px solid #ddd;
        background: #fff;
      }
      button.primary {
        background: #4facfe;
        color: #fff;
        border: none;
      }

      .split {
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 16px;
        margin-top: 16px;
      }

      .panel {
        border: 1px solid #eee;
        border-radius: 12px;
        padding: 12px;
        background: #fafafa;
      }
      .panel h3 {
        margin: 0 0 10px;
        font-size: 14px;
      }

      .breadcrumb {
        font-size: 12px;
        color: #666;
        margin-bottom: 8px;
      }

      .search {
        width: 87%;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #ddd;
        margin-bottom: 8px;
      }

      .list {
        max-height: 360px;
        overflow: auto;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .item {
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #e9e9e9;
        background: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .item:hover {
        background: #f2f7ff;
      }
      .item.active {
        background: #eaf3ff;
        border-color: #b7d6ff;
      }

      .icon {
        width: 26px;
        height: 26px;
        border-radius: 6px;
        background: #eee;
        display: grid;
        place-items: center;
        font-size: 14px;
      }

      .muted {
        font-size: 12px;
        color: #777;
      }

      /* Preview */
      .preview {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 12px;
        margin-top: 10px;
        margin-bottom: 50px;
      }
      .preview-item {
        position: relative;
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 6px;
        background: #fff;

        display: flex;
        flex-direction: column;
        justify-content: flex-start;

        min-height: 160px; /* 🔥 quan trọng */
      }

      .preview-item img {
        width: 100%;
        height: 90px;
        object-fit: cover;
        border-radius: 6px;
      }
      .preview-remove {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .preview-name {
        font-size: 12px;
        margin-top: 6px;
        line-height: 1.3;

        /* xuống dòng nhưng giới hạn */
        display: -webkit-box;
        -webkit-line-clamp: 2; /* tối đa 2 dòng */
        -webkit-box-orient: vertical;

        overflow: hidden;
        word-break: break-word;
      }

      .progress {
        width: 100%;
        background: #ddd;
        height: 18px;
        border-radius: 999px;
        margin-top: 10px;
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #4facfe, #00f2fe);
        font-size: 11px;
        line-height: 18px;
        text-align: center;
        color: #000;
      }

      /* Drag drop */
      #dropzone {
        margin-top: 16px;
        padding: 40px;
        min-height: 300px;
        border: 2px dashed #4facfe;
        border-radius: 16px;
        text-align: center;
        background: linear-gradient(180deg, #f6fbff, #eef6ff);
        cursor: pointer;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 16px;
        font-weight: 600;
        color: #333;
      }
      #dropzone:hover {
        background: #eaf5ff;
        border-color: #2f8cff;
      }

      .asset-item {
        position: relative;
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 6px;
        background: #fff;
        cursor: pointer;
      }
      .asset-item:hover {
        outline: 2px solid #4facfe;
        border-color: #4facfe;
      }
      .asset-item img {
        width: 100%;
        height: 90px;
        object-fit: cover;
        border-radius: 6px;
      }
      .asset-badge {
        position: absolute;
        top: 6px;
        left: 6px;
        font-size: 11px;
        background: rgba(0, 0, 0, 0.65);
        color: #fff;
        padding: 2px 6px;
        border-radius: 999px;
      }

      .asset-del {
        position: absolute;
        top: 6px;
        right: 6px;
        width: 24px;
        height: 24px;
        border-radius: 999px;
        border: 1px solid #ddd;
        background: #fff;
        cursor: pointer;
        font-size: 14px;
        line-height: 5px;
        display: grid;
        place-items: center;
      }
      .asset-del:hover {
        border-color: #ff5b5b;
        color: #ff5b5b;
      }
      /* Scroll cho asset trong folder */
      #assetList {
        max-height: 420px; /* chỉnh cao thấp tuỳ ý */
        overflow-y: auto;
        padding-right: 6px; /* chừa chỗ scrollbar */
      }

      /* Link input styling */
      .link-input {
        width: 100%;
        padding: 8px 10px;
        border-radius: 6px;
        border: 2px solid #4facfe;
        font-size: 13px;
        transition: all 0.3s;
        resize: vertical;
        min-height: 38px;
        font-family: inherit;
      }
      .link-input:focus {
        outline: none;
        border-color: #2f8cff;
        box-shadow: 0 0 0 3px rgba(79, 172, 254, 0.1);
      }
      .link-input:disabled {
        border-color: #ddd;
        background: #f5f5f5;
      }
      .link-btn {
        margin-top: 6px;
        width: 100%;
        background: #f0f8ff;
        color: #4facfe;
        border: 1px solid #4facfe;
      }
      .link-btn:hover:not(:disabled) {
        background: #4facfe;
        color: white;
      }
      .link-btn:disabled {
        background: #f5f5f5;
        color: #999;
        border-color: #ddd;
        cursor: not-allowed;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Clone Files từ Shared Drive → My Drive</h2>

      <div class="row">
        <button class="primary" onclick="login()">🔐 Đăng nhập Google</button>
        <span id="who" class="muted"></span>
      </div>

      <div class="split">
        <div class="panel">
          <h3>Folder nguồn (Shared/My Drive)</h3>

          <div style="margin-bottom: 10px">
            <textarea
              id="sourceLinkInput"
              class="link-input"
              placeholder="🔗 Paste link folder nguồn (mỗi link 1 dòng):
https://drive.google.com/drive/folders/abc123...
https://drive.google.com/drive/folders/xyz789...
(có thể paste nhiều link cùng lúc)"
              rows="4"
              disabled
            ></textarea>
            <button
              onclick="loadFromSourceLinks()"
              class="link-btn"
              id="loadSourceBtn"
              disabled
            >
              📥 Load từ link(s)
            </button>
            <div
              id="loadedFoldersInfo"
              class="muted"
              style="margin-top: 6px; display: none"
            >
              ✅ Đã load <b id="loadedFolderCount">0</b> folders
            </div>
          </div>

          <div
            style="
              text-align: center;
              margin: 10px 0;
              color: #999;
              font-size: 12px;
            "
          >
            ── hoặc browse ──
          </div>

          <div id="breadcrumb" class="breadcrumb">My Drive</div>
          <input
            id="folderSearch"
            class="search"
            placeholder="Tìm thư mục..."
            oninput="renderFolders()"
            disabled
          />
          <div class="muted">
            Folder nguồn: <b id="chosenFolder">Chưa chọn</b>
          </div>
          <div id="folderList" class="list"></div>
          <div class="muted" style="margin-top: 10px">
            Files trong folder: <b id="fileCount">0</b>
          </div>

          <div id="assetList" class="preview" style="margin-top: 8px"></div>
        </div>

        <div class="panel">
          <h3>Folder đích (My Drive)</h3>

          <div style="margin-bottom: 10px">
            <input
              id="destLinkInput"
              type="text"
              class="link-input"
              placeholder="🔗 Paste link folder đích (VD: https://drive.google.com/drive/folders/xyz789...)"
              disabled
            />
            <button
              onclick="loadFromDestLink()"
              class="link-btn"
              id="loadDestBtn"
              disabled
            >
              📥 Load từ link
            </button>
          </div>

          <div
            style="
              text-align: center;
              margin: 10px 0;
              color: #999;
              font-size: 12px;
            "
          >
            ── hoặc browse ──
          </div>

          <div id="destBreadcrumb" class="breadcrumb">My Drive</div>
          <input
            id="destFolderSearch"
            class="search"
            placeholder="Tìm thư mục đích..."
            oninput="renderDestFolders()"
            disabled
          />
          <div class="muted">Folder đích: <b id="destFolder">Chưa chọn</b></div>
          <div id="destFolderList" class="list"></div>

          <button
            class="primary"
            onclick="startClone()"
            style="margin-top: 20px"
          >
            🚀 Clone tất cả files
          </button>
          <button onclick="clearSelection()">🧹 Clear</button>

          <div class="progress">
            <div id="progressBar" class="progress-bar">0%</div>
          </div>
          <div id="status" class="muted">Chưa có thao tác</div>
        </div>
      </div>
    </div>

    <script src="https://apis.google.com/js/api.js"></script>
    <script src="https://accounts.google.com/gsi/client"></script>

    <script>
      const CLIENT_ID =
        "860632481172-1nnq4dparmjdqrrehh407uv33ppvu2b7.apps.googleusercontent.com";
      const API_KEY = "AIzaSyC6aOoJLRvkAmOn8MVtsu6yPO-mzK3AR3U";
      const SCOPES =
        "https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/drive.file";

      const DISCOVERY =
        "https://www.googleapis.com/discovery/v1/apis/drive/v3/rest";

      let accessToken = null;
      let currentFolderId = "root";
      let folderStack = [{ id: "root", name: "My Drive" }];
      let allFolders = [];
      let folderId = null; // Source folder
      let driveAssets = []; // Files trong folder nguồn

      // Destination folder variables
      let destCurrentFolderId = "root";
      let destFolderStack = [{ id: "root", name: "My Drive" }];
      let destAllFolders = [];
      let destFolderId = null;

      function initGapi() {
        return new Promise((resolve) => {
          gapi.load("client", async () => {
            await gapi.client.init({
              apiKey: API_KEY,
              discoveryDocs: [DISCOVERY],
            });
            resolve();
          });
        });
      }

      function login() {
        const tc = google.accounts.oauth2.initTokenClient({
          client_id: CLIENT_ID,
          scope: SCOPES,
          callback: async (t) => {
            accessToken = t.access_token;
            await initGapi();
            gapi.client.setToken({ access_token: accessToken });
            document.getElementById("who").textContent =
              "✅ Đã kết nối Google Drive";

            // Enable all inputs
            document.getElementById("folderSearch").disabled = false;
            document.getElementById("destFolderSearch").disabled = false;
            document.getElementById("sourceLinkInput").disabled = false;
            document.getElementById("destLinkInput").disabled = false;
            document.getElementById("loadSourceBtn").disabled = false;
            document.getElementById("loadDestBtn").disabled = false;

            folderStack = [{ id: "root", name: "My Drive" }];
            destFolderStack = [{ id: "root", name: "My Drive" }];
            folderId = null;
            destFolderId = null;
            await loadFolders("root");
            await loadDestFolders("root");
          },
        });
        tc.requestAccessToken();
      }

      // Extract folder ID from Google Drive link
      function extractFolderId(url) {
        if (!url) return null;

        // Remove whitespace
        url = url.trim();

        // If it's already just an ID (no http/https), return it
        if (!url.includes("http") && !url.includes("/")) {
          return url;
        }

        // Match patterns like:
        // https://drive.google.com/drive/folders/FOLDER_ID
        // https://drive.google.com/drive/u/0/folders/FOLDER_ID
        // https://drive.google.com/drive/folders/FOLDER_ID?usp=sharing
        const patterns = [/\/folders\/([a-zA-Z0-9_-]+)/, /id=([a-zA-Z0-9_-]+)/];

        for (const pattern of patterns) {
          const match = url.match(pattern);
          if (match && match[1]) {
            return match[1];
          }
        }

        return null;
      }

      async function loadFromSourceLinks() {
        const input = document.getElementById("sourceLinkInput");
        const text = input.value.trim();

        if (!text) {
          alert("Vui lòng nhập link folder!");
          return;
        }

        // Split by lines and filter empty lines
        const lines = text
          .split("\n")
          .map((line) => line.trim())
          .filter((line) => line);

        if (lines.length === 0) {
          alert("Vui lòng nhập ít nhất 1 link!");
          return;
        }

        const folderIds = [];
        const invalidLines = [];

        // Extract folder IDs from all lines
        lines.forEach((line, index) => {
          const folderId = extractFolderId(line);
          if (folderId) {
            folderIds.push(folderId);
          } else {
            invalidLines.push(`Dòng ${index + 1}: ${line.substring(0, 50)}...`);
          }
        });

        if (folderIds.length === 0) {
          alert(
            "Không có link hợp lệ nào!\n\nVui lòng dùng link dạng:\nhttps://drive.google.com/drive/folders/FOLDER_ID",
          );
          return;
        }

        if (invalidLines.length > 0) {
          const confirmMsg = `Có ${invalidLines.length} link không hợp lệ:\n${invalidLines.slice(0, 3).join("\n")}${invalidLines.length > 3 ? "\n..." : ""}\n\nTiếp tục load ${folderIds.length} link hợp lệ?`;
          if (!confirm(confirmMsg)) {
            return;
          }
        }

        try {
          document.getElementById("status").textContent =
            `Đang load ${folderIds.length} folders...`;

          // Reset progress bar
          progressBar.style.width = "0%";
          progressBar.textContent = "0%";

          // Clear previous data
          driveAssets = [];
          const loadedFolders = [];
          let successCount = 0;
          let errorCount = 0;

          // Load all folders
          for (let i = 0; i < folderIds.length; i++) {
            const folderId = folderIds[i];

            try {
              document.getElementById("status").textContent =
                `Đang load folder ${i + 1}/${folderIds.length}...`;

              // Update progress bar
              const percent = Math.round(((i + 1) / folderIds.length) * 100);
              progressBar.style.width = percent + "%";
              progressBar.textContent = percent + "%";

              // Get folder info
              const folderInfo = await gapi.client.drive.files.get({
                fileId: folderId,
                fields: "id,name,mimeType",
                supportsAllDrives: true,
              });

              if (
                folderInfo.result.mimeType !==
                "application/vnd.google-apps.folder"
              ) {
                console.warn(`${folderId} không phải là folder, bỏ qua`);
                errorCount++;
                continue;
              }

              loadedFolders.push({
                id: folderId,
                name: folderInfo.result.name,
              });

              // Load files from this folder
              let pageToken = null;
              do {
                const res = await gapi.client.drive.files.list({
                  q: `trashed=false and '${folderId}' in parents`,
                  fields:
                    "nextPageToken, files(id,name,mimeType,thumbnailLink,iconLink,size)",
                  pageSize: 1000,
                  pageToken,
                  supportsAllDrives: true,
                  includeItemsFromAllDrives: true,
                });

                (res.result.files || []).forEach((f) => {
                  if (f.mimeType !== "application/vnd.google-apps.folder") {
                    // Add folder name to file for reference
                    f.sourceFolder = folderInfo.result.name;
                    driveAssets.push(f);
                  }
                });

                pageToken = res.result.nextPageToken;
              } while (pageToken);

              successCount++;
            } catch (error) {
              console.error(`Error loading folder ${folderId}:`, error);
              errorCount++;
            }
          }

          // Update UI
          if (successCount > 0) {
            // Mark as selected (for clone operation)
            folderId = "multi-folder-mode"; // Special marker
            folderStack = loadedFolders;

            document.getElementById("chosenFolder").textContent =
              `${successCount} folders (${driveAssets.length} files)`;

            document.getElementById("fileCount").textContent =
              driveAssets.length;
            document.getElementById("loadedFolderCount").textContent =
              successCount;
            document.getElementById("loadedFoldersInfo").style.display =
              "block";

            renderAssets();

            const statusMsg =
              errorCount > 0
                ? `✅ Load xong ${successCount}/${folderIds.length} folders (${driveAssets.length} files). ${errorCount} lỗi.`
                : `✅ Load xong ${successCount} folders (${driveAssets.length} files)`;

            document.getElementById("status").textContent = statusMsg;
          } else {
            alert(
              "Không load được folder nào! Kiểm tra:\n1. Link có đúng không?\n2. Bạn có quyền truy cập không?",
            );
            document.getElementById("status").textContent =
              "❌ Không load được folder nào";
          }
        } catch (error) {
          console.error("Error loading folders:", error);
          alert("Lỗi khi load folders!");
          document.getElementById("status").textContent = "❌ Lỗi load folders";
        }
      }

      async function loadFromDestLink() {
        const input = document.getElementById("destLinkInput");
        const url = input.value.trim();

        if (!url) {
          alert("Vui lòng nhập link folder!");
          return;
        }

        const folderId = extractFolderId(url);

        if (!folderId) {
          alert(
            "Link không hợp lệ! Vui lòng dùng link dạng:\nhttps://drive.google.com/drive/folders/FOLDER_ID",
          );
          return;
        }

        try {
          document.getElementById("status").textContent =
            "Đang load folder đích từ link...";

          // Get folder info
          const folderInfo = await gapi.client.drive.files.get({
            fileId: folderId,
            fields: "id,name,mimeType",
            supportsAllDrives: false,
          });

          if (
            folderInfo.result.mimeType !== "application/vnd.google-apps.folder"
          ) {
            alert("Link này không phải là folder!");
            return;
          }

          // Reset folder stack and load this folder
          destFolderStack = [{ id: folderId, name: folderInfo.result.name }];
          await loadDestFolders(folderId);

          // Auto select this folder
          destCurrentFolderId = folderId;
          selectDestFolder();

          document.getElementById("status").textContent =
            `✅ Đã load folder đích: ${folderInfo.result.name}`;
        } catch (error) {
          console.error("Error loading dest folder:", error);
          alert(
            "Lỗi khi load folder đích! Kiểm tra:\n1. Link có đúng không?\n2. Bạn có quyền truy cập folder không?\n3. Folder phải trong My Drive",
          );
          document.getElementById("status").textContent =
            "❌ Lỗi load folder đích từ link";
        }
      }

      async function loadFolders(parentId) {
        currentFolderId = parentId;
        allFolders = [];
        driveAssets = [];
        let pageToken = null;

        do {
          const res = await gapi.client.drive.files.list({
            q:
              parentId === "root"
                ? "trashed=false"
                : `trashed=false and '${parentId}' in parents`,
            fields:
              "nextPageToken, files(id,name,mimeType,thumbnailLink,iconLink,size)",
            pageSize: 1000,
            pageToken,
            supportsAllDrives: true,
            includeItemsFromAllDrives: true,
          });

          (res.result.files || []).forEach((f) => {
            if (f.mimeType === "application/vnd.google-apps.folder") {
              allFolders.push(f);
            } else {
              // Lấy tất cả files, không chỉ ảnh
              driveAssets.push(f);
            }
          });

          pageToken = res.result.nextPageToken;
        } while (pageToken);

        renderFolders();
        renderAssets();
      }

      async function loadDestFolders(parentId) {
        destCurrentFolderId = parentId;
        destAllFolders = [];
        let pageToken = null;

        do {
          const res = await gapi.client.drive.files.list({
            q:
              parentId === "root"
                ? "trashed=false and mimeType='application/vnd.google-apps.folder'"
                : `trashed=false and '${parentId}' in parents and mimeType='application/vnd.google-apps.folder'`,
            fields: "nextPageToken, files(id,name,mimeType)",
            pageSize: 1000,
            pageToken,
            supportsAllDrives: false, // Only My Drive for destination
          });

          destAllFolders = destAllFolders.concat(res.result.files || []);
          pageToken = res.result.nextPageToken;
        } while (pageToken);

        renderDestFolders();
      }

      async function deleteDriveFile(fileId) {
        await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}`, {
          method: "DELETE",
          headers: { Authorization: "Bearer " + accessToken },
        });
      }

      function renderFolders() {
        const list = document.getElementById("folderList");
        const keyword = folderSearch.value.toLowerCase();
        list.innerHTML = "";

        if (folderStack.length > 1)
          list.innerHTML += `<div class="item" onclick="goUp()"><div class="icon">↩</div>Quay lại</div>`;

        list.innerHTML += `<div class="item ${
          folderId === currentFolderId ? "active" : ""
        }" onclick="selectFolder()">📌 Chọn folder này làm nguồn</div>`;

        allFolders
          .filter((f) => !keyword || f.name.toLowerCase().includes(keyword))
          .forEach((f) => {
            list.innerHTML += `<div class="item" onclick="enterFolder('${f.id}','${f.name}')"><div class="icon">📁</div>${f.name}</div>`;
          });

        breadcrumb.textContent = folderStack.map((f) => f.name).join(" / ");

        // Update file count
        document.getElementById("fileCount").textContent = driveAssets.length;
      }

      function renderDestFolders() {
        const list = document.getElementById("destFolderList");
        const keyword = destFolderSearch.value.toLowerCase();
        list.innerHTML = "";

        if (destFolderStack.length > 1)
          list.innerHTML += `<div class="item" onclick="goUpDest()"><div class="icon">↩</div>Quay lại</div>`;

        list.innerHTML += `<div class="item ${
          destFolderId === destCurrentFolderId ? "active" : ""
        }" onclick="selectDestFolder()">📌 Chọn folder này làm đích</div>`;

        destAllFolders
          .filter((f) => !keyword || f.name.toLowerCase().includes(keyword))
          .forEach((f) => {
            list.innerHTML += `<div class="item" onclick="enterDestFolder('${f.id}','${f.name}')"><div class="icon">📁</div>${f.name}</div>`;
          });

        destBreadcrumb.textContent = destFolderStack
          .map((f) => f.name)
          .join(" / ");
      }

      function renderAssets() {
        const box = document.getElementById("assetList");
        if (!box) return;

        box.innerHTML = "";
        const frag = document.createDocumentFragment();

        driveAssets.slice(0, 50).forEach((f) => {
          const div = document.createElement("div");
          div.className = "asset-item";

          const img = document.createElement("img");
          img.loading = "lazy";

          if (f.mimeType && f.mimeType.startsWith("image/")) {
            img.src = f.thumbnailLink || f.iconLink || "";
          } else {
            img.src = f.iconLink || "";
          }

          const name = document.createElement("div");
          name.className = "preview-name";
          name.textContent = f.name;

          div.append(img, name);
          frag.appendChild(div);
        });

        if (driveAssets.length > 50) {
          const more = document.createElement("div");
          more.className = "muted";
          more.style.padding = "10px";
          more.textContent = `...và ${driveAssets.length - 50} files nữa`;
          frag.appendChild(more);
        }

        box.appendChild(frag);
      }

      function escapeHtml(str) {
        return String(str).replace(
          /[&<>"']/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;",
            })[m],
        );
      }

      function enterFolder(id, name) {
        folderStack.push({ id, name });
        loadFolders(id);
      }

      function goUp() {
        folderStack.pop();
        loadFolders(folderStack.at(-1).id);
      }

      function selectFolder() {
        folderId = currentFolderId;
        chosenFolder.textContent = folderStack.at(-1).name;
      }

      function enterDestFolder(id, name) {
        destFolderStack.push({ id, name });
        loadDestFolders(id);
      }

      function goUpDest() {
        destFolderStack.pop();
        loadDestFolders(destFolderStack.at(-1).id);
      }

      function selectDestFolder() {
        destFolderId = destCurrentFolderId;
        destFolder.textContent = destFolderStack.at(-1).name;
      }

      function clearSelection() {
        folderId = null;
        destFolderId = null;
        driveAssets = [];
        chosenFolder.textContent = "Chưa chọn";
        destFolder.textContent = "Chưa chọn";
        document.getElementById("fileCount").textContent = "0";
        document.getElementById("loadedFoldersInfo").style.display = "none";
        document.getElementById("sourceLinkInput").value = "";

        // Clear subfolder cache
        Object.keys(subfolderCache).forEach(
          (key) => delete subfolderCache[key],
        );
        Object.keys(pendingSubfolders).forEach(
          (key) => delete pendingSubfolders[key],
        );

        renderAssets();
        status.textContent = "🧹 Đã xóa lựa chọn";
        progressBar.style.width = "0%";
        progressBar.textContent = "0%";
      }

      // Cache để lưu subfolder đã tạo (tên folder -> folder ID)
      const subfolderCache = {};
      // Pending promises để tránh race condition khi tạo folder đồng thời
      const pendingSubfolders = {};

      async function getOrCreateSubfolder(parentFolderId, folderName) {
        // Check cache first
        const cacheKey = `${parentFolderId}:${folderName}`;
        if (subfolderCache[cacheKey]) {
          return subfolderCache[cacheKey];
        }

        // Check if there's already a pending request for this folder
        if (pendingSubfolders[cacheKey]) {
          return await pendingSubfolders[cacheKey];
        }

        // Create promise for this folder
        const promise = (async () => {
          try {
            // Check if subfolder already exists
            const searchRes = await gapi.client.drive.files.list({
              q: `name='${folderName.replace(/'/g, "\\'")}' and '${parentFolderId}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`,
              fields: "files(id,name)",
              pageSize: 1,
              supportsAllDrives: true,
              includeItemsFromAllDrives: true,
            });

            if (searchRes.result.files && searchRes.result.files.length > 0) {
              // Subfolder exists
              const subfolderId = searchRes.result.files[0].id;
              subfolderCache[cacheKey] = subfolderId;
              return subfolderId;
            }

            // Create new subfolder
            const createRes = await gapi.client.drive.files.create({
              resource: {
                name: folderName,
                mimeType: "application/vnd.google-apps.folder",
                parents: [parentFolderId],
              },
              fields: "id",
            });

            const subfolderId = createRes.result.id;
            subfolderCache[cacheKey] = subfolderId;
            return subfolderId;
          } catch (error) {
            console.error("Error creating subfolder:", error);
            // Return parent folder if failed
            return parentFolderId;
          } finally {
            // Remove from pending
            delete pendingSubfolders[cacheKey];
          }
        })();

        // Store pending promise
        pendingSubfolders[cacheKey] = promise;
        return await promise;
      }

      async function copyFile(
        fileId,
        fileName,
        destFolderId,
        sourceFolder = null,
      ) {
        // If sourceFolder is provided, create/get subfolder first
        let targetFolderId = destFolderId;
        if (sourceFolder && folderId === "multi-folder-mode") {
          targetFolderId = await getOrCreateSubfolder(
            destFolderId,
            sourceFolder,
          );
        }

        const response = await fetch(
          `https://www.googleapis.com/drive/v3/files/${fileId}/copy`,
          {
            method: "POST",
            headers: {
              Authorization: "Bearer " + accessToken,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              name: fileName,
              parents: [targetFolderId],
            }),
          },
        );

        if (!response.ok) {
          throw new Error(`Failed to copy ${fileName}`);
        }

        return await response.json();
      }

      async function startClone() {
        if (!folderId) {
          alert("Vui lòng chọn folder nguồn!");
          return;
        }

        if (!destFolderId) {
          alert("Vui lòng chọn folder đích!");
          return;
        }

        if (driveAssets.length === 0) {
          alert("Folder nguồn không có file nào!");
          return;
        }

        // Build confirm message based on mode
        let confirmMsg;
        if (folderId === "multi-folder-mode") {
          // Multi-folder mode
          const folderNames = folderStack
            .map((f) => `  • ${f.name}`)
            .join("\n");
          confirmMsg = `Bạn muốn clone ${driveAssets.length} files từ ${folderStack.length} folders:\n${folderNames}\n\nSang:\n"${destFolderStack.at(-1).name}"\n\nTiếp tục?`;
        } else {
          // Single folder mode
          confirmMsg = `Bạn muốn clone ${driveAssets.length} files từ:\n"${folderStack.at(-1).name}"\n\nSang:\n"${destFolderStack.at(-1).name}"\n\nTiếp tục?`;
        }

        if (!confirm(confirmMsg)) {
          return;
        }

        status.textContent = "Đang bắt đầu clone...";
        document.getElementById("loadedFoldersInfo").style.display = "none";

        const CONCURRENCY = 3;
        let done = 0;
        const queue = [...driveAssets];
        const errors = [];

        async function worker() {
          while (queue.length) {
            const file = queue.shift();

            try {
              const displayName = file.sourceFolder
                ? `${file.name} [từ ${file.sourceFolder}]`
                : file.name;

              status.textContent = `Đang clone: ${displayName} (${done + 1}/${driveAssets.length})`;

              await copyFile(
                file.id,
                file.name,
                destFolderId,
                file.sourceFolder,
              );

              done++;
              const percent = Math.round((done / driveAssets.length) * 100);
              progressBar.style.width = percent + "%";
              progressBar.textContent = percent + "%";
            } catch (error) {
              console.error("Error copying file:", file.name, error);
              errors.push({ name: file.name, error: error.message });
            }
          }
        }

        await Promise.all(Array.from({ length: CONCURRENCY }, worker));

        if (errors.length > 0) {
          status.textContent = `✅ Hoàn tất! Clone ${done}/${driveAssets.length} files. ${errors.length} lỗi.`;
          console.log("Errors:", errors);
        } else {
          status.textContent = `✅ Hoàn tất! Đã clone ${done} files thành công!`;
        }
      }
    </script>
  </body>
